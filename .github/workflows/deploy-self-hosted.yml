name: Deploy (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, sir-labs]
    steps:
      - uses: actions/checkout@v4

      - name: Test OAuth including PostgreSQL replay protection
        run: bash scripts/test-oauth.sh

      - run: docker version

      - name: Ensure sir-net exists
        run: docker network inspect sir-server_sir-net >/dev/null 2>&1 || docker network create sir-server_sir-net

      - name: Write .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          umask 077
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "SETUP_SECRET=$SETUP_SECRET"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "ADMIN_EMAIL=$ADMIN_EMAIL"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "COOKIE_DOMAIN=.sir-labs.com"
          } > .env

      - run: flock --wait 600 /tmp/sir-deploy.lock docker compose -f compose.yaml -f compose.sir.yaml up --build -d --remove-orphans

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' sir-auth)" = healthy ] && exit 0
            sleep 5
          done
          docker logs --tail 50 sir-auth
          exit 1

      - name: Seed admin without pulling an extra image
        env:
          SETUP_SECRET: ${{ secrets.SETUP_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python3 scripts/seed-admin.py

      # Verify the additive native client migration after service health.
      - name: Verify native client registration
        run: |
          python3 scripts/verify-native-client.py

      - if: always()
        run: docker image prune -f
