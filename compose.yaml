services:
  sir-auth:
    container_name: sir-auth
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SETUP_SECRET: ${SETUP_SECRET:?set SETUP_SECRET in .env}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.sir-labs.com}
      SESSION_TTL: ${SESSION_TTL:-168h}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-true}
    depends_on:
      sir-auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sir-auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sirauth
      POSTGRES_DB: sirauth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - sir-auth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirauth -d sirauth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sir-auth-db:
