# Rendered like sir-server-repo gateway/watcher (branch token-gate) nginxConfTmpl:
# one gated route (app), one public route (pub) and the auth host, on .e2e.test.
# 00-sir-auth.conf is the watcher's sirAuthMapsConf verbatim.

upstream app {
    server whoami:80;
}

server {
    listen 80;
    server_name app.e2e.test;


    location = /_sir_auth {
        internal;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sir_auth_upstream http://sir-auth:8080;
        proxy_pass $sir_auth_upstream/session/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $sir_client_ip;
    }

    location @sir_login {
        default_type application/json;
        if ($sir_pat) {
            add_header WWW-Authenticate 'Bearer realm="sir-labs"' always;
            return 401 '{"error":"invalid_token"}\n';
        }
        return 302 https://auth.e2e.test/login?rd=https://$host$request_uri;
    }

    location / {
        auth_request /_sir_auth;
        auth_request_set $sir_auth_user_id $upstream_http_x_auth_user_id;
        auth_request_set $sir_auth_email $upstream_http_x_auth_email;
        auth_request_set $sir_auth_role $upstream_http_x_auth_role;
        error_page 401 = @sir_login;
        proxy_set_header Authorization $sir_backend_auth;
        proxy_set_header X-Auth-User-Id $sir_auth_user_id;
        proxy_set_header X-Auth-Email $sir_auth_email;
        proxy_set_header X-Auth-Role $sir_auth_role;
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

upstream pub {
    server whoami:80;
}

server {
    listen 80;
    server_name pub.e2e.test;


    location / {
        proxy_set_header Authorization $sir_backend_auth;
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Email "";
        proxy_set_header X-Auth-Role "";
        proxy_pass http://pub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

upstream sir-auth {
    server sir-auth:8080;
}

server {
    listen 80;
    server_name auth.e2e.test;


    # nginx calls verify directly on sir-auth; never from outside.
    location = /session/verify {
        return 404;
    }

    location / {
        proxy_set_header Authorization $sir_backend_auth;
        proxy_set_header X-Auth-User-Id "";
        proxy_set_header X-Auth-Email "";
        proxy_set_header X-Auth-Role "";
        proxy_pass http://sir-auth;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
